<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Marathi Hate Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="popup-body">
    <div class="popup-container">
        <h2>Marathi Hate Detector</h2>

            <div class="status-dot"></div>

            <span id="totalScanned">0</span>
            <br><br>
            <b>Harmful Messages:</b>

            <br><br>
            <b>Safe Messages:</b>
            <span id="totalSafe">0</span>
            <br><br>
            <b>Platform:</b>
            <span id="platform">Social Media</span>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
