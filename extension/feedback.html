<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MAITRI - Reported Errors</title>
    <link rel="stylesheet" href="feedback.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <h1>MAITRI</h1>
            <p>Reported Errors</p>
        </div>
        <button id="refreshButton">Refresh</button>
    </header>

    <main class="container">
        <section class="stats">
            <div class="stat-card">
                <div class="stat-title">Total Reports</div>
                <div class="stat-value" id="totalReports">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">High Risk</div>
                <div class="stat-value high" id="highRisk">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Medium Risk</div>
                <div class="stat-value medium" id="mediumRisk">0</div>
            </div>
        </section>

        <section class="reports-section">
            <div class="reports-header">
                <div>
                    <h2>Reported Errors</h2>
                    <p>Messages reported by users as incorrect detections.</p>
                </div>
                <span id="status">Loading...</span>
            </div>

            <div id="reportsContainer"></div>
        </section>
    </main>

    <script src="feedback.js"></script>
</body>
</html>
